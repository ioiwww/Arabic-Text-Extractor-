name: Extract and Fix Arabic PDFs

on:
  push:
    branches:
      - main  # أو اسم الفرع الأساسي عندك
  workflow_dispatch: # هاد اللي بيسمحلك تشغله يدوياً على الملفات الموجودة

jobs:
  build:
    runs-on: ubuntu-latest
    
    # حل مشكلة الـ 403 (Permission Denied)
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # عشان يسحب كل الملفات بوضوح

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Extraction Script
      run: python extract_arabic_pdf.py

    - name: Commit and Push Results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # التأكد من إضافة مجلد output حتى لو كان جديد
        git add output/
        
        # الالتزام بالتغييرات (Commit)
        git commit -m "Auto-extracted Arabic text from existing PDFs" || echo "No changes to commit"
        
        # الرفع باستخدام التوكن التلقائي للأكشن
        git push origin HEAD
