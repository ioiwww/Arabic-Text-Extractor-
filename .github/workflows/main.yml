name: Extract and Fix Arabic PDFs

on:
  push:
    
  workflow_dispatch: # يسمح لك بتشغيله يدوياً

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Extraction Script
      run: python extract_arabic_pdf.py

    - name: Commit and Push Results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/
        git commit -m "Add extracted text and docx files" || exit 0
        git push
