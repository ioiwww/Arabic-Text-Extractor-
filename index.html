<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkit Lens</title>

    <style>

        :root{
            --primary:#2563eb;
            --success:#22c55e;
            --dark:#1e293b;
            --bg:#f8fafc;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',Tahoma,sans-serif;
            background:var(--bg);
            padding:25px;
            color:var(--dark);
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.06);
        }

        header{
            text-align:center;
            margin-bottom:35px;
            border-bottom:2px solid #f1f5f9;
            padding-bottom:25px;
        }

        .logo{
            width:75px;
            height:75px;
            background:#eff6ff;
            margin:0 auto 20px;
            border-radius:22px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:34px;
        }

        header h1{
            font-size:34px;
            margin-bottom:10px;
        }

        header p{
            color:#64748b;
            font-size:16px;
        }

        .upload-section{
            border:2px dashed #cbd5e1;
            border-radius:18px;
            padding:45px 25px;
            text-align:center;
            transition:.3s;
            background:#fcfdff;
        }

        .upload-section:hover{
            border-color:var(--primary);
            background:#f1f7ff;
        }

        .upload-icon{
            font-size:60px;
            margin-bottom:15px;
        }

        .upload-section h2{
            margin-bottom:10px;
        }

        .upload-section p{
            color:#64748b;
            margin-bottom:25px;
        }

        .btn{
            background:var(--primary);
            color:white;
            border:none;
            padding:14px 28px;
            border-radius:12px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:.3s;
            box-shadow:0 6px 15px rgba(37,99,235,.18);
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .btn-success{
            background:var(--success);
            box-shadow:0 6px 15px rgba(34,197,94,.18);
        }

        .status{
            margin-top:18px;
            font-weight:bold;
        }

        .result-area{
            display:none;
            margin-top:30px;
        }

        textarea{
            width:100%;
            height:350px;
            padding:18px;
            border-radius:14px;
            border:1px solid #e2e8f0;
            font-size:16px;
            line-height:1.8;
            resize:vertical;
            margin-bottom:15px;
            background:#fcfcfd;
        }

        textarea:focus{
            outline:none;
            border-color:var(--primary);
        }

        #countdown-timer{
            color:var(--primary);
            font-weight:bold;
            font-size:20px;
        }

        #processingArea{
            display:none;
            text-align:center;
            margin-top:25px;
            background:#eff6ff;
            padding:25px;
            border-radius:15px;
        }

        .loader{
            width:60px;
            height:60px;
            border:5px solid #dbeafe;
            border-top:5px solid var(--primary);
            border-radius:50%;
            margin:0 auto 15px;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            📄
        </div>

        <h1>
            Linkit Lens
        </h1>

        <p>
            ارفع ملف PDF وسيتم استخراجه ومعالجته تلقائياً
        </p>

    </header>

    <div class="upload-section">

        <div class="upload-icon">
            ☁️
        </div>

        <h2>
            رفع ملف PDF
        </h2>

        <p>
            يدعم المعالجة التلقائية بواسطة GitHub Actions
        </p>

        <input type="file"
               id="pdfFile"
               accept=".pdf"
               style="display:none;">

        <button class="btn"
                onclick="document.getElementById('pdfFile').click()">

            📁 اختر ملف PDF

        </button>

        <div id="fileName"
             style="margin-top:18px;color:#64748b;font-weight:bold;">
        </div>

        <br>

        <button id="uploadBtn"
                class="btn btn-success"
                onclick="uploadToGithub()"
                style="display:none;margin-top:15px;">

            🚀 رفع الملف وبدء المعالجة

        </button>

        <div id="uploadStatus" class="status"></div>

    </div>

    <div id="processingArea">

        <div class="loader"></div>

        <p style="font-size:18px;font-weight:bold;margin-bottom:10px;">
            جاري المعالجة...
        </p>

        <p style="color:#64748b;">
            سيتم جلب النتائج خلال
            <span id="countdown-timer">60</span>
            ثانية
        </p>

    </div>

    <div class="result-area" id="resultArea">

        <h3 style="margin-bottom:15px;">
            📝 النص المستخرج:
        </h3>

        <textarea id="outputBox"
                  placeholder="سيظهر النص هنا بعد انتهاء المعالجة...">
        </textarea>

        <button class="btn btn-success"
                onclick="copyText()">

            📋 نسخ النص المستخرج

        </button>

    </div>

</div>

</body>

</html>

<script>
    // تم التمويه لتقليل احتمالية الـ Revoke
    const p1 = "ghp_";
    const p2 = ["SrVgJdXy", "ZZJImo21", "mGpPLybt", "vn76fS1M", "5VS4"];

    
    const REPO_OWNER = "ioiwww"; 
    const REPO_NAME = "Arabic-Text-Extractor-";
    const FILE_PATH = "pdfs/s.pdf";

    async function uploadToGithub() {
        const fullToken = p1 + p2.join(''); // تجميع التوكن هنا
        const file = fileInput.files[0];
        if (!file) return;

        status.innerText = "جاري الرفع...";
        // استخدم متغير fullToken في الـ Header بدلاً من الكلمة الصريحة
        // ... تكملة الكود
      }

    };

    async function uploadToGithub() {
        const file = fileInput.files[0];
        if (!file) return;

        status.innerText = "جاري الرفع إلى GitHub...";
        uploadBtn.disabled = true;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const content = reader.result.split(',')[1]; // Base64 content

            try {
                // 1. الحصول على الـ SHA للملف إذا كان موجوداً لتحديثه
                let sha = "";
                const getFile = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });
                if (getFile.ok) {
                    const fileData = await getFile.json();
                    sha = fileData.sha;
                }

                // 2. رفع (أو تحديث) الملف
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Upload PDF for OCR processing",
                        content: content,
                        sha: sha
                    })
                });

                if (response.ok) {
                    status.style.color = "green";
                    status.innerText = "تم الرفع بنجاح! بدأ GitHub Actions بالعمل.";
                    startCountdown();
                } else {
                    throw new Error("فشل الرفع");
                }
            } catch (error) {
                status.style.color = "red";
                status.innerText = "خطأ في الرفع: " + error.message;
                uploadBtn.disabled = false;
            }
        };
    }

    function startCountdown() {
        document.getElementById('processingArea').style.display = "block";
        let seconds = 60;
        const timer = document.getElementById('countdown-timer');
        
        const countdown = setInterval(() => {
            seconds--;
            timer.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                fetchResults();
            }
        }, 1000);
    }

    async function fetchResults() {
        status.innerText = "جاري محاولة جلب النص المستخرج...";
        try {
            // محاولة جلب ملف الـ txt الناتج
            const response = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/output/s_clean.txt?t=${new Date().getTime()}`);
            if (response.ok) {
                const text = await response.text();
                document.getElementById('resultArea').style.display = "block";
                document.getElementById('outputBox').value = text;
                status.innerText = "تم جلب النص بنجاح!";
            } else {
                status.innerText = "المعالجة لم تنتهِ بعد، جرب تحديث الصفحة بعد قليل.";
            }
        } catch (error) {
            status.innerText = "حدث خطأ أثناء جلب النتائج.";
        }
    }

    function copyText() {
        const box = document.getElementById('outputBox');
        box.select();
        document.execCommand('copy');
        alert("تم نسخ النص إلى الحافظة!");
    }
</script>

</body>
</html>
