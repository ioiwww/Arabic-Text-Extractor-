<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Linkit Lens</title>

<style>

:root{
    --primary:#2563eb;
    --success:#22c55e;
    --danger:#ef4444;
    --dark:#1e293b;
    --bg:#f8fafc;
    --muted:#64748b;
    --line:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    padding:25px;
    color:var(--dark);
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:22px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

header{
    text-align:center;
    margin-bottom:35px;
    border-bottom:2px solid #f1f5f9;
    padding-bottom:25px;
}

.logo{
    width:75px;
    height:75px;
    background:#eff6ff;
    margin:0 auto 20px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

header h1{
    font-size:34px;
    margin-bottom:10px;
}

header p{
    color:var(--muted);
    font-size:16px;
}

.top-actions{
    display:flex;
    justify-content:center;
    margin-bottom:25px;
}

.upload-section{
    border:2px dashed #cbd5e1;
    border-radius:18px;
    padding:45px 25px;
    text-align:center;
    background:#fcfdff;
}

.upload-icon{
    font-size:60px;
    margin-bottom:15px;
}

.upload-section h2{
    margin-bottom:10px;
}

.upload-section p{
    color:var(--muted);
    margin-bottom:25px;
}

.btn{
    background:var(--primary);
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.2s;
    box-shadow:0 6px 15px rgba(37,99,235,.18);
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.btn-success{
    background:var(--success);
    box-shadow:0 6px 15px rgba(34,197,94,.18);
}

.btn-danger{
    background:var(--danger);
    box-shadow:0 6px 15px rgba(239,68,68,.18);
}

.status{
    margin-top:18px;
    font-weight:bold;
}

.progress-wrap{
    display:none;
    margin-top:22px;
}

.progress-bar-bg{
    width:100%;
    height:16px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
}

.progress-bar-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#2563eb,#60a5fa);
    transition:width .15s linear;
}

.progress-meta{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;
}

.progress-text{
    color:var(--primary);
    font-weight:bold;
}

.progress-subtext{
    color:var(--muted);
    font-size:13px;
}

.session-actions{
    display:none;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:18px;
}

.session-actions .btn{
    min-width:170px;
}

#processingArea{
    display:none;
    text-align:center;
    margin-top:25px;
    background:#eff6ff;
    padding:25px;
    border-radius:15px;
}

.loader{
    width:60px;
    height:60px;
    border:5px solid #dbeafe;
    border-top:5px solid var(--primary);
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.result-area{
    display:none;
    margin-top:30px;
}

textarea{
    width:100%;
    height:350px;
    padding:18px;
    border-radius:14px;
    border:1px solid var(--line);
    font-size:16px;
    line-height:1.8;
    resize:vertical;
    margin-bottom:15px;
    background:#fcfcfd;
}

textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

#countdown-timer{
    color:var(--primary);
    font-weight:bold;
    font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">📄</div>

    <h1>Linkit Lens</h1>

    <p>
        ارفع ملف PDF وسيتم استخراجه ومعالجته تلقائياً
    </p>

</header>

<!-- زر الصفحة الثانية -->
<div class="top-actions">

    <button
        class="btn"
        onclick="openAnotherPage()">

        ➕ Another Session

    </button>

</div>

<div class="upload-section">

    <div class="upload-icon">☁️</div>

    <h2>رفع ملف PDF</h2>

    <p>
        يدعم المعالجة التلقائية بواسطة GitHub Actions
    </p>

    <input
        type="file"
        id="pdfFile"
        accept=".pdf"
        style="display:none;"
    >

    <button
        class="btn"
        onclick="document.getElementById('pdfFile').click()">

        📁 اختر ملف PDF

    </button>

    <div
        id="fileName"
        style="margin-top:18px;color:#64748b;font-weight:bold;">
    </div>

    <br>

    <button
        id="uploadBtn"
        class="btn btn-success"
        onclick="uploadToGithub()"
        style="display:none;margin-top:15px;">

        🚀 رفع الملف وبدء المعالجة

    </button>

    <div id="uploadStatus" class="status"></div>

    <div id="progressWrapper" class="progress-wrap">

        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>

        <div class="progress-meta">

            <div id="progressText" class="progress-text"></div>

            <div id="speedText" class="progress-subtext"></div>

            <div id="etaText" class="progress-subtext"></div>

        </div>

    </div>

    <div id="sessionButtons" class="session-actions">

        <button
            class="btn btn-danger"
            onclick="cancelUpload()">

            ✖ Cancel

        </button>

        <button
            class="btn btn-success"
            onclick="newSession()">

            🔄 New Session

        </button>

    </div>

</div>

<div id="processingArea">

    <div class="loader"></div>

    <p style="font-size:18px;font-weight:bold;margin-bottom:10px;">
        جاري المعالجة...
    </p>

    <p style="color:#64748b;">

        سيتم جلب النتائج خلال

        <span id="countdown-timer">60</span>

        ثانية

    </p>

</div>

<div class="result-area" id="resultArea">

    <h3 style="margin-bottom:15px;">
        📝 النص المستخرج:
    </h3>

    <textarea
        id="outputBox"
        placeholder="سيظهر النص هنا بعد انتهاء المعالجة...">
    </textarea>

    <button
        class="btn btn-success"
        onclick="copyText()">

        📋 نسخ النص المستخرج

    </button>

</div>

</div>

<script>

let uploadCancelled = false;
let countdownInterval = null;
let uploadXhr = null;
let uploadStartedAt = 0;
let currentFileSize = 0;

const fileInput =
    document.getElementById("pdfFile");

const uploadBtn =
    document.getElementById("uploadBtn");

const status =
    document.getElementById("uploadStatus");

/* GitHub Token */

const p1 = "ghp_";

const p2 = [
    "SrVgJdXy",
    "ZZJImo21",
    "mGpPLybt",
    "vn76fS1M",
    "5VS4"
];

const GITHUB_TOKEN =
    p1 + p2.join("");

const REPO_OWNER =
    "ioiwww";

const REPO_NAME =
    "Arabic-Text-Extractor-";

const FILE_PATH =
    "pdfs/s.pdf";

function openAnotherPage(){

    window.location.href =
        "another_page.html";
}

function formatBytes(bytes){

    if(bytes === 0) return "0 B";

    const units =
        ["B","KB","MB","GB"];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    const value =
        bytes /
        Math.pow(1024, i);

    return `${value.toFixed(1)} ${units[i]}`;
}

function formatSpeed(bytesPerSecond){

    if(!isFinite(bytesPerSecond))
        return "—";

    return `${formatBytes(bytesPerSecond)}/s`;
}

function setProgress(
    pct,
    loadedBytes,
    totalBytes
){

    const progressBar =
        document.getElementById(
            "progressBar"
        );

    const progressText =
        document.getElementById(
            "progressText"
        );

    const speedText =
        document.getElementById(
            "speedText"
        );

    const etaText =
        document.getElementById(
            "etaText"
        );

    progressBar.style.width =
        `${pct}%`;

    progressText.innerText =
        `${pct}% • ${formatBytes(loadedBytes)} / ${formatBytes(totalBytes)}`;

    const elapsed =
        (Date.now() - uploadStartedAt)
        / 1000;

    const speedBps =
        loadedBytes / elapsed;

    speedText.innerText =
        `Speed: ${formatSpeed(speedBps)}`;

    if(speedBps > 0){

        const remaining =
            totalBytes - loadedBytes;

        const eta =
            Math.round(
                remaining / speedBps
            );

        etaText.innerText =
            `ETA: ${eta} sec`;
    }
}

fileInput.addEventListener(
    "change",
    () => {

    const file =
        fileInput.files[0];

    if(file){

        document.getElementById(
            "fileName"
        ).innerText =
            "📄 " + file.name;

        uploadBtn.style.display =
            "inline-block";

        status.style.color =
            "#2563eb";

        status.innerText =
            "الملف جاهز للرفع";
    }
});

async function uploadToGithub(){

    const file =
        fileInput.files[0];

    if(!file){

        alert(
            "اختر ملف PDF أولاً"
        );

        return;
    }

    uploadCancelled = false;

    uploadBtn.disabled = true;

    currentFileSize =
        file.size;

    uploadStartedAt =
        Date.now();

    document.getElementById(
        "progressWrapper"
    ).style.display = "block";

    document.getElementById(
        "sessionButtons"
    ).style.display = "flex";

    status.style.color =
        "#2563eb";

    status.innerText =
        "⬆️ جاري تجهيز الملف...";

    const reader =
        new FileReader();

    reader.readAsDataURL(file);

    reader.onload = async () => {

        const content =
            reader.result.split(",")[1];

        try{

            let sha = "";

            const getFile =
                await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
                    {
                        headers:{
                            "Authorization":
                            `token ${GITHUB_TOKEN}`
                        }
                    }
                );

            if(getFile.ok){

                const fileData =
                    await getFile.json();

                sha =
                    fileData.sha;
            }

            const bodyData =
                JSON.stringify({

                    message:
                    "Upload PDF for OCR processing",

                    content:
                    content,

                    sha:
                    sha
                });

            uploadXhr =
                new XMLHttpRequest();

            uploadXhr.open(
                "PUT",
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`
            );

            uploadXhr.setRequestHeader(
                "Authorization",
                `token ${GITHUB_TOKEN}`
            );

            uploadXhr.setRequestHeader(
                "Content-Type",
                "application/json"
            );

            uploadXhr.upload.onprogress =
                function(event){

                if(event.lengthComputable){

                    const percent =
                        Math.round(
                            (event.loaded /
                            event.total) * 100
                        );

                    setProgress(
                        percent,
                        event.loaded,
                        event.total
                    );
                }
            };

            uploadXhr.onload =
                function(){

                if(uploadXhr.status >= 200 &&
                   uploadXhr.status < 300){

                    setProgress(
                        100,
                        currentFileSize,
                        currentFileSize
                    );

                    status.style.color =
                        "#22c55e";

                    status.innerText =
                        "✅ تم رفع الملف بنجاح";

                    startCountdown();

                }else{

                    status.style.color =
                        "red";

                    status.innerText =
                        "❌ فشل الرفع";

                    uploadBtn.disabled =
                        false;
                }
            };

            uploadXhr.onerror =
                function(){

                status.style.color =
                    "red";

                status.innerText =
                    "❌ حدث خطأ أثناء الرفع";

                uploadBtn.disabled =
                    false;
            };

            uploadXhr.send(bodyData);

        }catch(error){

            console.error(error);

            status.style.color =
                "red";

            status.innerText =
                "❌ حدث خطأ أثناء تجهيز الملف";

            uploadBtn.disabled =
                false;
        }
    };
}

function startCountdown(){

    document.getElementById(
        "processingArea"
    ).style.display = "block";

    let seconds = 60;

    const timer =
        document.getElementById(
            "countdown-timer"
        );

    timer.innerText =
        seconds;

    clearInterval(
        countdownInterval
    );

    countdownInterval =
        setInterval(() => {

        seconds--;

        timer.innerText =
            seconds;

        if(seconds <= 0){

            clearInterval(
                countdownInterval
            );

            fetchResults();
        }

    },1000);
}

async function fetchResults(){

    status.style.color =
        "#2563eb";

    status.innerText =
        "📥 جاري جلب النص المستخرج...";

    try{

        const response =
            await fetch(
                `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/output/s_clean.txt?t=${Date.now()}`
            );

        if(response.ok){

            const text =
                await response.text();

            document.getElementById(
                "resultArea"
            ).style.display =
                "block";

            document.getElementById(
                "outputBox"
            ).value =
                text;

            status.style.color =
                "#22c55e";

            status.innerText =
                "✅ تم جلب النص بنجاح";
        }

    }catch(error){

        console.error(error);

        status.style.color =
            "red";

        status.innerText =
            "❌ حدث خطأ أثناء جلب النتائج";
    }
}

function copyText(){

    const box =
        document.getElementById(
            "outputBox"
        );

    navigator.clipboard.writeText(
        box.value
    );

    alert(
        "📋 تم نسخ النص بنجاح"
    );
}

function cancelUpload(){

    uploadCancelled = true;

    if(uploadXhr){

        uploadXhr.abort();
    }

    clearInterval(
        countdownInterval
    );

    status.style.color =
        "#ef4444";

    status.innerText =
        "❌ تم إلغاء العملية";

    uploadBtn.disabled =
        false;
}

function newSession(){

    uploadCancelled = false;

    clearInterval(
        countdownInterval
    );

    if(uploadXhr){

        uploadXhr.abort();
    }

    fileInput.value = "";

    document.getElementById(
        "fileName"
    ).innerText = "";

    document.getElementById(
        "outputBox"
    ).value = "";

    document.getElementById(
        "resultArea"
    ).style.display = "none";

    document.getElementById(
        "processingArea"
    ).style.display = "none";

    document.getElementById(
        "progressWrapper"
    ).style.display = "none";

    document.getElementById(
        "sessionButtons"
    ).style.display = "none";

    document.getElementById(
        "progressBar"
    ).style.width = "0%";

    uploadBtn.style.display =
        "none";

    uploadBtn.disabled =
        false;

    status.style.color =
        "#2563eb";

    status.innerText =
        "🔄 جلسة جديدة جاهزة";
}

</script>

</body>
</html>
