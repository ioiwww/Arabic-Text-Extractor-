<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkit Lens</title>

<style>
:root{
    --primary:#2563eb;
    --success:#22c55e;
    --dark:#1e293b;
    --bg:#f8fafc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    padding:25px;
    color:var(--dark);
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

header{
    text-align:center;
    margin-bottom:35px;
    border-bottom:2px solid #f1f5f9;
    padding-bottom:25px;
}

.logo{
    width:75px;
    height:75px;
    background:#eff6ff;
    margin:0 auto 20px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

header h1{
    font-size:34px;
    margin-bottom:10px;
}

header p{
    color:#64748b;
    font-size:16px;
}

.upload-section{
    border:2px dashed #cbd5e1;
    border-radius:18px;
    padding:45px 25px;
    text-align:center;
    transition:.3s;
    background:#fcfdff;
}

.upload-section:hover{
    border-color:var(--primary);
    background:#f1f7ff;
}

.upload-icon{
    font-size:60px;
    margin-bottom:15px;
}

.upload-section h2{
    margin-bottom:10px;
}

.upload-section p{
    color:#64748b;
    margin-bottom:25px;
}

.btn{
    background:var(--primary);
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 6px 15px rgba(37,99,235,.18);
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.btn-success{
    background:var(--success);
    box-shadow:0 6px 15px rgba(34,197,94,.18);
}

.status{
    margin-top:18px;
    font-weight:bold;
}

.result-area{
    display:none;
    margin-top:30px;
}

textarea{
    width:100%;
    height:350px;
    padding:18px;
    border-radius:14px;
    border:1px solid #e2e8f0;
    font-size:16px;
    line-height:1.8;
    resize:vertical;
    margin-bottom:15px;
    background:#fcfcfd;
}

textarea:focus{
    outline:none;
    border-color:var(--primary);
}

#countdown-timer{
    color:var(--primary);
    font-weight:bold;
    font-size:20px;
}

#processingArea{
    display:none;
    text-align:center;
    margin-top:25px;
    background:#eff6ff;
    padding:25px;
    border-radius:15px;
}

.loader{
    width:60px;
    height:60px;
    border:5px solid #dbeafe;
    border-top:5px solid var(--primary);
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.progress-wrap{
    display:none;
    margin-top:20px;
}

.progress-bar-bg{
    width:100%;
    height:14px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
}

.progress-bar-fill{
    width:0%;
    height:100%;
    background:var(--primary);
    transition:width .2s ease;
}

.progress-text{
    margin-top:10px;
    font-weight:bold;
    color:var(--primary);
}

.session-actions{
    display:none;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:15px;
}

.btn-danger{
    background:#ef4444;
    box-shadow:0 6px 15px rgba(239,68,68,.18);
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">📄</div>
    <h1>Linkit Lens</h1>
    <p>ارفع ملف PDF وسيتم استخراجه ومعالجته تلقائياً</p>
</header>

<div class="upload-section">

    <div class="upload-icon">☁️</div>

    <h2>رفع ملف PDF</h2>

    <p>يدعم المعالجة التلقائية بواسطة GitHub Actions</p>

    <input type="file"
           id="pdfFile"
           accept=".pdf"
           style="display:none;">

    <button class="btn"
            onclick="document.getElementById('pdfFile').click()">
        📁 اختر ملف PDF
    </button>

    <div id="fileName"
         style="margin-top:18px;color:#64748b;font-weight:bold;"></div>

    <br>

    <button id="uploadBtn"
            class="btn btn-success"
            onclick="uploadToGithub()"
            style="display:none;margin-top:15px;">
        🚀 رفع الملف وبدء المعالجة
    </button>

    <div id="uploadStatus" class="status"></div>

    <div id="progressWrapper" class="progress-wrap">
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div id="progressText" class="progress-text"></div>
    </div>

    <div id="sessionButtons" class="session-actions">
        <button class="btn btn-danger" onclick="cancelUpload()">✖ Cancel</button>
        <button class="btn btn-success" onclick="newSession()">🔄 New Session</button>
    </div>

</div>

<div id="processingArea">
    <div class="loader"></div>
    <p style="font-size:18px;font-weight:bold;margin-bottom:10px;">جاري المعالجة...</p>
    <p style="color:#64748b;">
        سيتم جلب النتائج خلال
        <span id="countdown-timer">60</span>
        ثانية
    </p>
</div>

<div class="result-area" id="resultArea">
    <h3 style="margin-bottom:15px;">📝 النص المستخرج:</h3>
    <textarea id="outputBox" placeholder="سيظهر النص هنا بعد انتهاء المعالجة..."></textarea>
    <button class="btn btn-success" onclick="copyText()">📋 نسخ النص المستخرج</button>
</div>

</div>

<script>

const fileInput =
    document.getElementById("pdfFile");

const uploadBtn =
    document.getElementById("uploadBtn");

const status =
    document.getElementById("uploadStatus");

/* بيانات GitHub */

const p1 = "ghp_";

const p2 = [
    "SrVgJdXy",
    "ZZJImo21",
    "mGpPLybt",
    "vn76fS1M",
    "5VS4"
];

const GITHUB_TOKEN =
    p1 + p2.join("");

const REPO_OWNER =
    "ioiwww";

const REPO_NAME =
    "Arabic-Text-Extractor-";

const FILE_PATH =
    "pdfs/s.pdf";

/* عند اختيار الملف */

fileInput.addEventListener("change", () => {

    const file = fileInput.files[0];

    if(file){

        document.getElementById(
            "fileName"
        ).innerText =
            "📄 " + file.name;

        uploadBtn.style.display =
            "inline-block";

        status.style.color =
            "#2563eb";

        status.innerText =
            "الملف جاهز للرفع";
    }
});
async function uploadToGithub() {
    const file = fileInput.files[0];

    if (!file) {
        alert("اختر ملف PDF أولاً");
        return;
    }

    uploadCancelled = false;
    uploadBtn.disabled = true;

    document.getElementById("progressWrapper").style.display = "block";
    document.getElementById("sessionButtons").style.display = "flex";

    status.style.color = "#2563eb";
    status.innerText = "⬆️ جاري تجهيز الملف...";

    const reader = new FileReader();
    reader.readAsDataURL(file);

    reader.onload = async () => {
        const content = reader.result.split(",")[1];

        try {
            let sha = "";

            const getFile = await fetch(
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
                {
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`
                    }
                }
            );

            if (getFile.ok) {
                const fileData = await getFile.json();
                sha = fileData.sha;
            }

            let progress = 0;
            const progressBar = document.getElementById("progressBar");
            const progressText = document.getElementById("progressText");

            clearInterval(uploadProgressInterval);
            uploadProgressInterval = setInterval(() => {
                if (uploadCancelled) {
                    clearInterval(uploadProgressInterval);
                    return;
                }

                if (progress < 90) {
                    progress += 3;
                    if (progress > 90) progress = 90;

                    progressBar.style.width = progress + "%";

                    const uploadedMB = ((file.size * progress / 100) / 1024 / 1024).toFixed(1);
                    const totalMB = (file.size / 1024 / 1024).toFixed(1);

                    progressText.innerText = `${progress}% • ${uploadedMB} MB / ${totalMB} MB`;
                }
            }, 300);

            if (uploadCancelled) {
                clearInterval(uploadProgressInterval);
                status.style.color = "red";
                status.innerText = "❌ تم إلغاء الرفع";
                uploadBtn.disabled = false;
                return;
            }

            const response = await fetch(
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
                {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Upload PDF for OCR processing",
                        content: content,
                        sha: sha
                    })
                }
            );

            clearInterval(uploadProgressInterval);

            if (uploadCancelled) {
                status.style.color = "red";
                status.innerText = "❌ تم إلغاء الرفع";
                uploadBtn.disabled = false;
                return;
            }

            if (response.ok) {
                progressBar.style.width = "100%";
                progressText.innerText = "100% • Upload Complete";

                status.style.color = "#22c55e";
                status.innerText = "✅ تم رفع الملف بنجاح";

                startCountdown();
            } else {
                throw new Error("Upload failed");
            }

        } catch (error) {
            console.error(error);

            status.style.color = "red";
            status.innerText = "❌ حدث خطأ أثناء الرفع";

            uploadBtn.disabled = false;
        }
    };
}

function startCountdown() {
    document.getElementById("processingArea").style.display = "block";

    let seconds = 60;
    const timer = document.getElementById("countdown-timer");
    timer.innerText = seconds;

    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        if (uploadCancelled) {
            clearInterval(countdownInterval);
            return;
        }

        seconds--;
        timer.innerText = seconds;

        if (seconds <= 0) {
            clearInterval(countdownInterval);
            fetchResults();
        }
    }, 1000);
}

async function fetchResults() {
    status.style.color = "#2563eb";
    status.innerText = "📥 جاري جلب النص المستخرج...";

    try {
        const response = await fetch(
            `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/output/s_clean.txt?t=${new Date().getTime()}`
        );

        if (response.ok) {
            const text = await response.text();

            document.getElementById("resultArea").style.display = "block";
            document.getElementById("outputBox").value = text;

            status.style.color = "#22c55e";
            status.innerText = "✅ تم جلب النص بنجاح";
        } else {
            status.style.color = "#f59e0b";
            status.innerText = "⏳ المعالجة لم تنتهِ بعد";
        }
    } catch (error) {
        console.error(error);
        status.style.color = "red";
        status.innerText = "❌ حدث خطأ أثناء جلب النتائج";
    }
}

function copyText() {
    const box = document.getElementById("outputBox");
    navigator.clipboard.writeText(box.value);
    alert("📋 تم نسخ النص بنجاح");
}

function cancelUpload() {
    uploadCancelled = true;

    clearInterval(countdownInterval);
    clearInterval(uploadProgressInterval);

    status.style.color = "#ef4444";
    status.innerText = "❌ تم إلغاء العملية";

    uploadBtn.disabled = false;

    document.getElementById("progressText").innerText = "Cancelled";
}

function newSession() {
    uploadCancelled = false;

    clearInterval(countdownInterval);
    clearInterval(uploadProgressInterval);

    fileInput.value = "";
    document.getElementById("fileName").innerText = "";
    document.getElementById("outputBox").value = "";

    document.getElementById("resultArea").style.display = "none";
    document.getElementById("processingArea").style.display = "none";
    document.getElementById("progressWrapper").style.display = "none";
    document.getElementById("sessionButtons").style.display = "none";

    document.getElementById("progressBar").style.width = "0%";
    document.getElementById("progressText").innerText = "";

    uploadBtn.style.display = "none";
    uploadBtn.disabled = false;

    status.style.color = "#2563eb";
    status.innerText = "🔄 جلسة جديدة جاهزة";
}
</script>

</body>
</html>
