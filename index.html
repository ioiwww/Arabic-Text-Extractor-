<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Linkit Lens OCR</title>

<style>

:root{
    --primary:#2563eb;
    --success:#22c55e;
    --danger:#ef4444;
    --bg:#f8fafc;
    --dark:#1e293b;
    --muted:#64748b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,sans-serif;
    background:var(--bg);
    padding:25px;
    color:var(--dark);
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

header{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    font-size:60px;
    margin-bottom:15px;
}

h1{
    margin-bottom:10px;
}

p{
    color:var(--muted);
}

.upload-box{
    margin-top:25px;
    border:2px dashed #cbd5e1;
    border-radius:18px;
    padding:35px;
    text-align:center;
}

.btn{
    background:var(--primary);
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-success{
    background:var(--success);
}

.btn-danger{
    background:var(--danger);
}

#status{
    margin-top:18px;
    font-weight:bold;
}

.progress-wrap{
    margin-top:20px;
    display:none;
}

.progress-bg{
    width:100%;
    height:16px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #2563eb,
        #60a5fa
    );
    transition:width .15s linear;
}

.progress-info{
    margin-top:10px;
    color:var(--muted);
}

.processing{
    display:none;
    text-align:center;
    margin-top:25px;
}

.loader{
    width:60px;
    height:60px;
    border:5px solid #dbeafe;
    border-top:5px solid #2563eb;
    border-radius:50%;
    margin:auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.result{
    display:none;
    margin-top:30px;
}

textarea{
    width:100%;
    height:350px;
    border-radius:14px;
    border:1px solid #e2e8f0;
    padding:18px;
    font-size:16px;
    line-height:1.8;
    resize:vertical;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">📄</div>

<h1>Linkit Lens</h1>

<p>
OCR Extraction via GitHub Actions
</p>

</header>

<div class="upload-box">

<input
    type="file"
    id="pdfFile"
    accept=".pdf"
    style="display:none;"
>

<button
    class="btn"
    onclick="document.getElementById('pdfFile').click()"
>

📁 اختر ملف PDF

</button>

<div
    id="fileName"
    style="margin-top:18px;font-weight:bold;"
></div>

<br>

<button
    id="uploadBtn"
    class="btn btn-success"
    style="display:none;margin-top:15px;"
    onclick="uploadToGithub()"
>

🚀 رفع الملف

</button>

<div id="status"></div>

<div
    id="progressWrap"
    class="progress-wrap"
>

<div class="progress-bg">

<div
    id="progressFill"
    class="progress-fill"
></div>

</div>

<div
    id="progressInfo"
    class="progress-info"
></div>

</div>

<div
    id="processing"
    class="processing"
>

<div class="loader"></div>

<p style="margin-top:15px;">
جارٍ انتظار المعالجة...
</p>

</div>

<div
    id="result"
    class="result"
>

<h3 style="margin-bottom:15px;">
📝 النص المستخرج
</h3>

<textarea
    id="outputBox"
></textarea>

<button
    class="btn btn-success"
    onclick="copyText()"
>

📋 نسخ النص

</button>

</div>

</div>

</div>

<script>

const fileInput =
    document.getElementById(
        "pdfFile"
    );

const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const progressWrap =
    document.getElementById(
        "progressWrap"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const progressInfo =
    document.getElementById(
        "progressInfo"
    );

const processingBox =
    document.getElementById(
        "processing"
    );

const resultBox =
    document.getElementById(
        "result"
    );

let currentFileName = "";

let uploadXhr = null;

let uploadStart = 0;

/* GitHub Config */

const p1 = "ghp_";

const p2 = [
    "SrVgJdXy",
    "ZZJImo21",
    "mGpPLybt",
    "vn76fS1M",
    "5VS4"
];

const GITHUB_TOKEN =
    p1 + p2.join("");

const REPO_OWNER =
    "ioiwww";

const REPO_NAME =
    "Arabic-Text-Extractor-";

const BRANCH =
    "main";

/* File Select */

fileInput.addEventListener(
    "change",
    () => {

    const file =
        fileInput.files[0];

    if(!file)
        return;

    document.getElementById(
        "fileName"
    ).innerText =
        `📄 ${file.name}`;

    uploadBtn.style.display =
        "inline-block";

    statusBox.innerText =
        "الملف جاهز";
});

/* Upload */

async function uploadToGithub(){

    const file =
        fileInput.files[0];

    if(!file){

        alert(
            "اختر ملف PDF"
        );

        return;
    }

    // دعم ملفات كبيرة
    if(file.size > 25 * 1024 * 1024){

        alert(
            "الملف كبير جداً"
        );

        return;
    }

    uploadBtn.disabled = true;

    resultBox.style.display =
        "none";

    processingBox.style.display =
        "none";

    progressWrap.style.display =
        "block";

    uploadStart =
        Date.now();

    const uniqueId =
        Date.now();

    currentFileName =
        `job_${uniqueId}.pdf`;

    const filePath =
        `pdfs/${currentFileName}`;

    statusBox.style.color =
        "#2563eb";

    statusBox.innerText =
        "📤 جاري قراءة الملف...";

    const reader =
        new FileReader();

    reader.readAsDataURL(file);

    reader.onload = async () => {

        try{

            const base64 =
                reader.result
                    .split(",")[1];

            const body =
                JSON.stringify({

                    message:
                    `Upload ${currentFileName}`,

                    content:
                    base64,

                    branch:
                    BRANCH
                });

            uploadXhr =
                new XMLHttpRequest();

            uploadXhr.open(
                "PUT",
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`
            );

            uploadXhr.setRequestHeader(
                "Authorization",
                `token ${GITHUB_TOKEN}`
            );

            uploadXhr.setRequestHeader(
                "Content-Type",
                "application/json"
            );

            uploadXhr.upload.onprogress =
                (event) => {

                if(event.lengthComputable){

                    const percent =
                        Math.round(
                            (event.loaded /
                            event.total) * 100
                        );

                    progressFill.style.width =
                        `${percent}%`;

                    const elapsed =
                        (Date.now() -
                        uploadStart) / 1000;

                    const speed =
                        event.loaded /
                        elapsed;

                    const mbps =
                        (
                            speed /
                            1024 /
                            1024
                        ).toFixed(2);

                    progressInfo.innerText =
                        `${percent}% • ${mbps} MB/s`;
                }
            };

            uploadXhr.onload =
                async () => {

                if(
                    uploadXhr.status >= 200 &&
                    uploadXhr.status < 300
                ){

                    statusBox.style.color =
                        "#22c55e";

                    statusBox.innerText =
                        "✅ تم رفع الملف";

                    progressFill.style.width =
                        "100%";

                    await triggerWorkflow();

                    startPolling();

                }else{

                    statusBox.style.color =
                        "red";

                    statusBox.innerText =
                        "❌ فشل الرفع";

                    uploadBtn.disabled =
                        false;
                }
            };

            uploadXhr.onerror =
                () => {

                statusBox.style.color =
                    "red";

                statusBox.innerText =
                    "❌ خطأ بالشبكة";

                uploadBtn.disabled =
                    false;
            };

            uploadXhr.send(body);

        }catch(e){

            console.error(e);

            statusBox.style.color =
                "red";

            statusBox.innerText =
                "❌ حدث خطأ";

            uploadBtn.disabled =
                false;
        }
    };
}

/* Trigger GitHub Action */

async function triggerWorkflow(){

    statusBox.innerText =
        "⚙️ بدء المعالجة...";

    await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/ocr.yml/dispatches`,
        {
            method:"POST",

            headers:{
                "Authorization":
                `token ${GITHUB_TOKEN}`,

                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                ref:BRANCH,

                inputs:{
                    filename:
                    currentFileName
                }
            })
        }
    );
}

/* Polling */

function startPolling(){

    processingBox.style.display =
        "block";

    const outputName =
        currentFileName.replace(
            ".pdf",
            "_clean.txt"
        );

    let attempts = 0;

    const interval =
        setInterval(
            async () => {

            attempts++;

            statusBox.style.color =
                "#2563eb";

            statusBox.innerText =
                `⏳ انتظار النتيجة... (${attempts})`;

            try{

                const response =
                    await fetch(
                        `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/output/${outputName}?t=${Date.now()}`
                    );

                if(response.ok){

                    clearInterval(
                        interval
                    );

                    const text =
                        await response.text();

                    document.getElementById(
                        "outputBox"
                    ).value =
                        text;

                    resultBox.style.display =
                        "block";

                    processingBox.style.display =
                        "none";

                    statusBox.style.color =
                        "#22c55e";

                    statusBox.innerText =
                        "✅ اكتملت المعالجة";

                    uploadBtn.disabled =
                        false;
                }

            }catch(e){

                console.log(e);
            }

            // timeout بعد 10 دقائق
            if(attempts > 120){

                clearInterval(
                    interval
                );

                processingBox.style.display =
                    "none";

                statusBox.style.color =
                    "red";

                statusBox.innerText =
                    "❌ انتهى وقت الانتظار";

                uploadBtn.disabled =
                    false;
            }

        },5000);
}

/* Copy */

function copyText(){

    const text =
        document.getElementById(
            "outputBox"
        ).value;

    navigator.clipboard.writeText(
        text
    );

    alert(
        "📋 تم النسخ"
    );
}

</script>

</body>
</html>
