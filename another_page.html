<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Repository Files</title>

<style>

:root{
    --primary:#2563eb;
    --success:#22c55e;
    --danger:#ef4444;
    --dark:#0f172a;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    padding:25px;
    color:var(--dark);
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    background:white;
    border-radius:24px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.header h1{
    font-size:34px;
    margin-bottom:8px;
}

.header p{
    color:#64748b;
    font-size:15px;
}

.top-actions{
    margin-top:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:14px;
    padding:13px 22px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:24px;
}

.stat-card{
    background:white;
    border-radius:20px;
    padding:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.04);
}

.stat-title{
    color:#64748b;
    font-size:14px;
    margin-bottom:8px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
}

.files-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.file-card{
    background:var(--card);
    border-radius:22px;
    padding:22px;
    border:1px solid var(--border);
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.file-card:hover{
    transform:translateY(-4px);
    border-color:#bfdbfe;
    box-shadow:0 12px 25px rgba(37,99,235,.08);
}

.file-icon{
    font-size:42px;
    margin-bottom:14px;
}

.file-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:10px;
    word-break:break-word;
}

.file-size{
    color:#64748b;
    font-size:14px;
    margin-bottom:16px;
}

.file-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action-btn{
    flex:1;
    min-width:110px;
    text-align:center;
    text-decoration:none;
    padding:11px;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}

.view-btn{
    background:#eff6ff;
    color:#2563eb;
}

.download-btn{
    background:#ecfdf5;
    color:#16a34a;
}

.loading{
    text-align:center;
    padding:70px 20px;
    color:#64748b;
}

.loader{
    width:70px;
    height:70px;
    border:6px solid #dbeafe;
    border-top:6px solid var(--primary);
    border-radius:50%;
    margin:0 auto 20px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty{
    background:white;
    border-radius:24px;
    padding:60px 25px;
    text-align:center;
}

.error{
    background:#fef2f2;
    color:#dc2626;
    border:1px solid #fecaca;
    padding:20px;
    border-radius:18px;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            📂 Repository Files
        </h1>

        <p>
            عرض ملفات GitHub Repository بشكل أنيق ومباشر
        </p>

        <div class="top-actions">

            <button class="btn btn-primary"
                    onclick="loadFiles()">

                🔄 Refresh Files

            </button>

            <button class="btn btn-success"
                    onclick="window.location.href='index.html'">

                ⬅ العودة للواجهة الرئيسية

            </button>

        </div>

    </div>

    <div class="stats">

        <div class="stat-card">

            <div class="stat-title">
                عدد الملفات
            </div>

            <div class="stat-value"
                 id="fileCount">
                0
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                حجم الملفات
            </div>

            <div class="stat-value"
                 id="totalSize">
                0 MB
            </div>

        </div>

    </div>

    <div id="loadingArea" class="loading">

        <div class="loader"></div>

        <h2>
            جاري تحميل الملفات...
        </h2>

    </div>

    <div id="errorArea"></div>

    <div class="files-grid"
         id="filesGrid">
    </div>

</div>

<script>

/* GitHub Credentials */

const p1 = "ghp_";

const p2 = [
    "SrVgJdXy",
    "ZZJImo21",
    "mGpPLybt",
    "vn76fS1M",
    "5VS4"
];

const GITHUB_TOKEN =
    p1 + p2.join("");

const REPO_OWNER =
    "ioiwww";

const REPO_NAME =
    "Arabic-Text-Extractor-";

/* Load Files */

async function loadFiles(){

    document.getElementById(
        "loadingArea"
    ).style.display = "block";

    document.getElementById(
        "filesGrid"
    ).innerHTML = "";

    document.getElementById(
        "errorArea"
    ).innerHTML = "";

    try{

        const response =
            await fetch(
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`,
                {
                    headers:{
                        "Authorization":
                        `token ${GITHUB_TOKEN}`
                    }
                }
            );

        if(!response.ok){

            throw new Error(
                "Failed to load repository"
            );
        }

        const files =
            await response.json();

        document.getElementById(
            "loadingArea"
        ).style.display = "none";

        renderFiles(files);

    }catch(error){

        console.error(error);

        document.getElementById(
            "loadingArea"
        ).style.display = "none";

        document.getElementById(
            "errorArea"
        ).innerHTML = `

            <div class="error">

                ❌ حدث خطأ أثناء تحميل الملفات

            </div>

        `;
    }
}

/* Render Files */

function renderFiles(files){

    const grid =
        document.getElementById(
            "filesGrid"
        );

    if(!files.length){

        grid.innerHTML = `

            <div class="empty">

                لا توجد ملفات داخل الريبو

            </div>

        `;

        return;
    }

    let totalBytes = 0;

    document.getElementById(
        "fileCount"
    ).innerText = files.length;

    files.forEach(file => {

        totalBytes += file.size || 0;

        let icon = "📄";

        if(file.type === "dir"){
            icon = "📁";
        }

        if(file.name.endsWith(".pdf")){
            icon = "📕";
        }

        if(file.name.endsWith(".txt")){
            icon = "📝";
        }

        if(file.name.endsWith(".html")){
            icon = "🌐";
        }

        const sizeMB =
            (file.size / 1024 / 1024).toFixed(2);

        const card =
            document.createElement("div");

        card.className =
            "file-card";

        card.innerHTML = `

            <div class="file-icon">
                ${icon}
            </div>

            <div class="file-name">
                ${file.name}
            </div>

            <div class="file-size">
                ${sizeMB} MB
            </div>

            <div class="file-actions">

                <a href="${file.html_url}"
                   target="_blank"
                   class="action-btn view-btn">

                    👁 View

                </a>

                <a href="${file.download_url || file.html_url}"
                   target="_blank"
                   class="action-btn download-btn">

                    ⬇ Download

                </a>

            </div>

        `;

        grid.appendChild(card);

    });

    const totalMB =
        (totalBytes / 1024 / 1024).toFixed(2);

    document.getElementById(
        "totalSize"
    ).innerText =
        totalMB + " MB";
}

/* Auto Load */

loadFiles();

</script>

</body>
</html>
