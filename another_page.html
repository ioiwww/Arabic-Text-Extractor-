<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>🌍 Web Hub</title>

<style>

:root{
    --primary:#2563eb;
    --primary-light:#dbeafe;
    --bg:#f1f5f9;
    --card:#ffffff;
    --dark:#0f172a;
    --text:#475569;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--dark);
    padding:24px;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* Header */

.header{
    background:white;
    border-radius:28px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.header h1{
    font-size:34px;
    margin-bottom:10px;
}

.header p{
    color:var(--text);
    font-size:15px;
}

.top-actions{
    margin-top:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:16px;
    padding:14px 22px;
    font-size:15px;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-add{
    background:#22c55e;
    color:white;
}

/* Search */

.search-box{
    margin:25px 0;
    position:relative;
}

.search-box input{
    width:100%;
    padding:18px 20px;
    border:none;
    border-radius:18px;
    font-size:16px;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.04);
    outline:none;
}

/* Grid */

.webs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

/* Card */

.web-card{
    background:var(--card);
    border-radius:24px;
    padding:24px;
    text-align:center;
    transition:.25s;
    border:1px solid var(--border);
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.web-card:hover{
    transform:translateY(-5px);
    border-color:#bfdbfe;
    box-shadow:0 15px 30px rgba(37,99,235,.10);
}

.web-icon{
    font-size:55px;
    margin-bottom:15px;
}

.web-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.web-url{
    color:var(--text);
    font-size:13px;
    word-break:break-word;
}

/* Add Card */

.add-card{
    border:2px dashed #93c5fd;
    background:#eff6ff;
}

.add-card:hover{
    background:#dbeafe;
}

/* Modal */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal-content{
    background:white;
    width:95%;
    max-width:450px;
    border-radius:24px;
    padding:25px;
}

.modal-content h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--border);
    outline:none;
    font-size:15px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
}

/* Responsive */

@media(max-width:600px){

    .header h1{
        font-size:26px;
    }

    .web-icon{
        font-size:45px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>
            🌍 Web Hub
        </h1>

        <p>
            قائمة مواقع جميلة وسريعة داخل التطبيق
        </p>

        <div class="top-actions">

            <button class="btn btn-primary"
                    onclick="renderWebs()">

                🔄 تحديث

            </button>

            <button class="btn btn-add"
                    onclick="openModal()">

                ➕ إضافة موقع

            </button>

        </div>

    </div>

    <!-- Search -->

    <div class="search-box">

        <input type="text"
               id="searchInput"
               placeholder="🔎 ابحث عن موقع..."
               onkeyup="searchWebs()">

    </div>

    <!-- Grid -->

    <div class="webs-grid"
         id="websGrid">
    </div>

</div>

<!-- Modal -->

<div class="modal"
     id="modal">

    <div class="modal-content">

        <h2>
            ➕ إضافة موقع جديد
        </h2>

        <div class="form-group">

            <input type="text"
                   id="siteName"
                   placeholder="اسم الموقع">

        </div>

        <div class="form-group">

            <input type="text"
                   id="siteURL"
                   placeholder="https://example.com">

        </div>

        <div class="form-group">

            <input type="text"
                   id="siteEmoji"
                   placeholder="🌐 إيموجي">

        </div>

        <div class="modal-actions">

            <button class="btn btn-primary"
                    onclick="addWebsite()">

                حفظ

            </button>

            <button class="btn"
                    onclick="closeModal()">

                إلغاء

            </button>

        </div>

    </div>

</div>

<script>

/* Default Websites */

let websites = JSON.parse(
    localStorage.getItem("websites")
) || [

    {
        name:"Google",
        url:"https://google.com",
        emoji:"🔎"
    },

    {
        name:"YouTube",
        url:"https://youtube.com",
        emoji:"▶️"
    },

    {
        name:"Facebook",
        url:"https://facebook.com",
        emoji:"📘"
    },

    {
        name:"Instagram",
        url:"https://instagram.com",
        emoji:"📸"
    },

    {
        name:"TikTok",
        url:"https://tiktok.com",
        emoji:"🎵"
    },

    {
        name:"Twitter / X",
        url:"https://x.com",
        emoji:"🐦"
    },

    {
        name:"ChatGPT",
        url:"https://chat.openai.com",
        emoji:"🤖"
    },

    {
        name:"Netflix",
        url:"https://netflix.com",
        emoji:"🎬"
    }

];

/* Render */

function renderWebs(){

    const grid =
        document.getElementById(
            "websGrid"
        );

    grid.innerHTML = "";

    websites.forEach(site => {

        const card =
            document.createElement("div");

        card.className =
            "web-card";

        card.onclick = () => {
            window.location.href = site.url;
        };

        card.innerHTML = `

            <div class="web-icon">
                ${site.emoji}
            </div>

            <div class="web-name">
                ${site.name}
            </div>

            <div class="web-url">
                ${site.url}
            </div>

        `;

        grid.appendChild(card);

    });

    /* Add Button Card */

    const addCard =
        document.createElement("div");

    addCard.className =
        "web-card add-card";

    addCard.onclick =
        openModal;

    addCard.innerHTML = `

        <div class="web-icon">
            ➕
        </div>

        <div class="web-name">
            إضافة موقع
        </div>

        <div class="web-url">
            اضغط لإضافة المزيد
        </div>

    `;

    grid.appendChild(addCard);
}

/* Search */

function searchWebs(){

    const value =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();

    const cards =
        document.querySelectorAll(
            ".web-card"
        );

    cards.forEach(card => {

        if(
            card.innerText
            .toLowerCase()
            .includes(value)
        ){
            card.style.display = "block";
        }else{
            card.style.display = "none";
        }

    });
}

/* Modal */

function openModal(){

    document.getElementById(
        "modal"
    ).style.display = "flex";
}

function closeModal(){

    document.getElementById(
        "modal"
    ).style.display = "none";
}

/* Add Website */

function addWebsite(){

    const name =
        document.getElementById(
            "siteName"
        ).value;

    const url =
        document.getElementById(
            "siteURL"
        ).value;

    const emoji =
        document.getElementById(
            "siteEmoji"
        ).value || "🌐";

    if(!name || !url){

        alert(
            "أدخل البيانات كاملة"
        );

        return;
    }

    websites.push({
        name,
        url,
        emoji
    });

    localStorage.setItem(
        "websites",
        JSON.stringify(websites)
    );

    closeModal();

    renderWebs();

    document.getElementById(
        "siteName"
    ).value = "";

    document.getElementById(
        "siteURL"
    ).value = "";

    document.getElementById(
        "siteEmoji"
    ).value = "";
}

/* Start */

renderWebs();

</script>

</body>
</html>
